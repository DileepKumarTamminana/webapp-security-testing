# OWASP ZAP Baseline Scan (DAST)
#
# Runs the OWASP ZAP "baseline" scan against a configurable target URL.
#
# IMPORTANT / AUTHORIZATION NOTICE:
#   The target_url MUST be an application you own or are explicitly
#   authorized to test. The default value below points to the public
#   OWASP Juice Shop demo instance, which is an intentionally vulnerable
#   application published by OWASP specifically to be tested/attacked.
#   Do NOT change the default target to any third-party production
#   system without written authorization. See docs/methodology.md and
#   README.md ("Scope & Authorization Note") for details.
#
# Triggers:
#   - Manual run via workflow_dispatch (lets you override the target URL)
#   - Weekly schedule (every Monday at 06:00 UTC)

name: OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized target URL to scan (must be owned/authorized for testing)"
        required: false
        default: "https://demo.owasp-juice.shop"
        type: string
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

env:
  # Falls back to the Juice Shop demo instance when triggered by schedule,
  # or when no input is supplied on manual dispatch.
  TARGET_URL: ${{ inputs.target_url || 'https://demo.owasp-juice.shop' }}

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline-scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Confirm scan target (authorization reminder)
        run: |
          echo "Scanning target: $TARGET_URL"
          echo "Reminder: only run this against systems you own or are authorized to test."

      # action-baseline already uploads the HTML/MD/JSON report as an artifact
      # named by `artifact_name`, so no separate upload-artifact step is needed
      # (a second step with the same name would 409 under upload-artifact@v4).
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"
          fail_action: false
